<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="logo"><img src="icons/icon48.png" alt=""></div>
    <div class="title">
      <h1>Map Scrapper</h1>
      <p>Google Maps business data extractor</p>
    </div>
    <span class="badge" id="badge">Idle</span>
  </header>

  <main>
    <section class="card">
      <label class="field-label" for="queries">Search query</label>
      <textarea id="queries" rows="3" placeholder="restaurants in Dhanmondi&#10;hotels in Cox's Bazar"></textarea>
      <p class="hint">Protiti line e ekta query. Faka rakhle current Maps tab scrape korbe.</p>

      <label class="toggle">
        <span><b>Detail mode</b><small>Phone, website, full address — slow</small></span>
        <input id="detailed" type="checkbox" checked><i></i>
      </label>
      <label class="toggle">
        <span><b>Email khujo</b><small>Website theke email ber kore</small></span>
        <input id="emails" type="checkbox"><i></i>
      </label>
      <label class="toggle">
        <span><b>Ager gulo skip koro</b><small>Age scrape kora jayga abar nibe na</small></span>
        <input id="skipSeen" type="checkbox" checked><i></i>
      </label>
      <div class="inline history">
        <span>History: <b id="seenCount">0</b> ta jayga</span>
        <button id="resetSeen" class="chip danger" title="History muche felo, abar sob jayga nibe">Reset</button>
      </div>
    </section>

    <div class="actions">
      <button id="start" class="btn primary">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Start
      </button>
      <button id="stop" class="btn ghost">
        <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>Stop
      </button>
    </div>

    <section class="stats">
      <div class="count"><span id="n">0</span><small>results</small></div>
      <div class="status-wrap">
        <span class="pulse"></span>
        <div id="status">Idle</div>
      </div>
    </section>

    <div class="exports">
      <button id="csv" class="chip">
        <svg viewBox="0 0 24 24"><path d="M12 16l-5-5h3V4h4v7h3zM5 18h14v2H5z"/></svg>CSV
      </button>
      <button id="json" class="chip">
        <svg viewBox="0 0 24 24"><path d="M12 16l-5-5h3V4h4v7h3zM5 18h14v2H5z"/></svg>JSON
      </button>
      <button id="clear" class="chip danger" title="Sob result muche felo (history thakbe)">
        <svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7zM9 4h6l1 2H8z"/></svg>Clear
      </button>
    </div>


    <section class="list-head">
      <span>Latest</span>
    </section>
    <ul id="preview"></ul>
  </main>

  <script src="popup.js"></script>
</body>
</html>
